name: PHP code style

on:
  pull_request:
  push:
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/fix-php-code-style-issues.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pint:
    name: Pint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none

      - name: Install Pint
        run: |
          mkdir -p "$RUNNER_TEMP/pint"
          composer require --working-dir="$RUNNER_TEMP/pint" 'laravel/pint:^1.14' --no-interaction --no-progress

      - name: Check code style
        run: "$RUNNER_TEMP/pint/vendor/bin/pint" --test
